server {
    listen 80;
    server_name feina.lobby34.eu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://feisea.lobby34.eu$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name feina.lobby34.eu;

    ssl_certificate /etc/letsencrypt/live/feina.lobby34.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feina.lobby34.eu/privkey.pem;

    return 301 https://feisea.lobby34.eu$request_uri;
}
