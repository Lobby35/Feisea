services:
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      args:
        POSTGRES_IMAGE: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in .env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:?Set TZ in .env}
    ports:
      - "${POSTGRES_BIND_ADDRESS:?Set POSTGRES_BIND_ADDRESS in .env}:${POSTGRES_PORT:?Set POSTGRES_PORT in .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  pgadmin:
    image: ${PGADMIN_IMAGE:?Set PGADMIN_IMAGE in .env}
    entrypoint: ["/venv/bin/python3", "/bootstrap.py"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_DISABLE_POSTFIX: ${PGADMIN_DISABLE_POSTFIX:?Set PGADMIN_DISABLE_POSTFIX in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${PGADMIN_BIND_ADDRESS:?Set PGADMIN_BIND_ADDRESS in .env}:${PGADMIN_PORT:?Set PGADMIN_PORT in .env}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/bootstrap.py:/bootstrap.py:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
